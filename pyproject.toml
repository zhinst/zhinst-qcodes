[build-system]
requires = ["setuptools>=61.2", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "zhinst-qcodes"
authors = [{ name = "Zurich Instrument", email = "info@zhinst.com" }]
description = "Zurich Instruments drivers for QCoDeS"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.13",
  "zhinst-toolkit>=0.7.1",
  "qcodes>=0.35.0",
  "typing_extensions>=4.1.1",
]
dynamic = ["version"]

[dependency-groups]
docs = [
  # Sphinx 9 broke autosectionlabel handling for myst-included markdown,
  # and several extensions in this stack (nbsphinx_link, pydata_sphinx_theme)
  # have not caught up yet.
  "sphinx<9",
  "sphinx-issues",
  "nbsphinx",
  "nbsphinx_link",
  # nbsphinx_link is unmaintained and imports docutils.utils.error_reporting,
  # which was removed in docutils 0.21.
  "docutils<0.21",
  "myst-parser",
  "pydata_sphinx_theme",
  "sphinx_autodoc_typehints",
  "jupytext",
  "ipython",
  "requests",
  "sphinxcontrib-spelling",
  "lxml_html_clean",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/zhinst/zhinst-qcodes"
"Bug Tracker" = "https://github.com/zhinst/zhinst-qcodes/issues"
Documentation = "https://docs.zhinst.com/zhinst-qcodes/en/latest/"
"Release notes" = "https://docs.zhinst.com/zhinst-qcodes/en/latest/changelog/index.html"
Source = "https://github.com/zhinst/zhinst-qcodes"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs", "examples", "tests", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = [
  # Missing docstring in __init__ (docstring lives on the class)
  "D107",
  # Missing docstring in magic method
  "D105",
  # Missing argument descriptions (not enforced by previous flake8 setup)
  "D417",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["zhinst"]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
addopts = "-l"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["zhinst.*"]
namespaces = true

[tool.setuptools_scm]
"write_to" = "src/zhinst/qcodes/_version.py"
"local_scheme" = "no-local-version"
