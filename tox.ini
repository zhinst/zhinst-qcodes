[tox]
envlist = py310, py311, py312, py313, py314, min, ruff, typing
skip_missing_interpreters = true
isolated_build = True

[testenv:py3]
basepython = python3

[testenv]
allowlist_externals =
    scripts/zhinst_qcodes_symlink.py
deps =
   py{310,311,312,313,314}: -rrequirements.txt
   pytest-cov
commands =
    # install toolkit first to ensure the correct version
    {envpython} -m pip install git+https://github.com/zhinst/zhinst-toolkit
    {envpython} -m pip install .
    {envpython} scripts/zhinst_qcodes_symlink.py
    {envpython} -m pytest --cov=zhinst.qcodes

[testenv:min]
description = Run tests against the oldest dependency versions declared in pyproject.toml
basepython = python3.10
allowlist_externals =
    scripts/zhinst_qcodes_symlink.py
deps =
    uv
    pytest-cov
commands =
    uv pip compile pyproject.toml --resolution=lowest-direct --python {envpython} --output-file {envtmpdir}/min-requirements.txt
    {envpython} -m pip install -r {envtmpdir}/min-requirements.txt
    {envpython} -m pip install --no-deps .
    {envpython} scripts/zhinst_qcodes_symlink.py
    {envpython} -m pytest --cov=zhinst.qcodes

[testenv:ruff]
deps =
    ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typing]
deps =
    mypy
commands =
    mypy -p zhinst.qcodes
